<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width , inital scale=1.0">
        <title>
            Minimal Navbar
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav class="navbar">
            <ul class="nav-links">
                <li>
                    <a href="#" class="nav-item active" data-title="Home Page">Home</a>
                </li>
                <li>
                    <a href="#" class="nav-item" data-title="About Us">About Us</a>
                </li>
                <li>
                    <a href="#" class="nav-item" data-title="Contact Us">Contact</a>
                </li>
            </ul>
        </nav>
        <script>
            const navitems = document.querySelectionAll('.nav-item');
            navItems.forEach
            (item=>
            {
                item.addEventListener('click', function(e)
                {
                    e.preventDefault();
                    navItems.forEach(nav => nav.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        </script>
    </body>
</html>
