<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width , inital scale=1.0">
        <title>
            Minimal Navbar
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav class="navbar">     
            <ul class="nav-links">       
                <li class="dropdown">        
                    <a href="#" class="nav-item" data-title="Services Overview">Services ▾
                    </a>         
                    <div class="dropdown-content">           
                    <a href="#" class="nav-item" data-title="Web Design">Web Design</a>           
                    <a href="#" class="nav-item" data-title="Development">Development</a>         
                    </div>       
                </li>     
            </ul>   
        </nav> 
          <script>     
          const navItems = document.querySelectorAll('.nav-item');     
          navItems.forEach(item =>
           
          {       
            item.addEventListener('click', function(e) 
            {         
                e.preventDefault();         
                navItems.forEach(nav => nav.classList.remove('active'));         
                this.classList.add('active');       
            });     
        });   

          </script> 
    </body>
</html>
